
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Speed Test</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --circle-size: 260px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      max-width: 420px;
      width: 100%;
    }

    /* Outer Breathing Circle Container */
    .gauge-wrapper {
      position: relative;
      width: var(--circle-size);
      height: var(--circle-size);
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      background: radial-gradient(circle, rgba(22,27,34,0.8) 0%, rgba(13,17,23,1) 100%);
      box-shadow: 0 0 30px var(--accent-glow), inset 0 0 15px var(--accent-glow);
    }

    .gauge-wrapper:hover {
      transform: scale(1.02);
    }

    .gauge-wrapper.testing {
      animation: pulse-ring 2s infinite ease-in-out;
      cursor: default;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px var(--accent-glow); }
      50% { box-shadow: 0 0 50px rgba(0, 242, 254, 0.6), inset 0 0 25px rgba(0, 242, 254, 0.6); }
      100% { box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px var(--accent-glow); }
    }

    /* SVG Ring Overlay */
    .gauge-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-bg-circle {
      fill: none;
      stroke: #21262d;
      stroke-width: 8;
    }

    .gauge-progress-circle {
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 8;
      stroke-dasharray: 754; /* 2 * PI * 120 */
      stroke-dashoffset: 754;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }

    /* Strict Central Layout Lock */
    .gauge-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    .status-text {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .speed-number {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .speed-unit {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--accent-color);
      margin-top: 4px;
    }

    /* Results Summary Card */
    .results-card {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      opacity: 0.4;
      transition: opacity 0.4s ease;
    }

    .results-card.active {
      opacity: 1;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Touch Triggered Central Circle -->
    <div class="gauge-wrapper" id="gaugeWrapper">
      <svg class="gauge-svg" viewBox="0 0 256 256">
        <circle class="gauge-bg-circle" cx="128" cy="128" r="120"></circle>
        <circle class="gauge-progress-circle" id="progressCircle" cx="128" cy="128" r="120"></circle>
      </svg>
      
      <!-- Center Aligned Content -->
      <div class="gauge-content">
        <div class="status-text" id="statusText">TAP TO START</div>
        <div class="speed-number" id="speedNumber">0.0</div>
        <div class="speed-unit" id="speedUnit">Mbps</div>
      </div>
    </div>

    <!-- Metrics Summary -->
    <div class="results-card" id="resultsCard">
      <div class="metric-item">
        <span class="metric-label">Ping</span>
        <span class="metric-value" id="pingVal">-- ms</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Download</span>
        <span class="metric-value" id="downloadVal">-- Mbps</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Upload</span>
        <span class="metric-value" id="uploadVal">-- Mbps</span>
      </div>
    </div>
  </div>

  <script>
    const gaugeWrapper = document.getElementById('gaugeWrapper');
    const progressCircle = document.getElementById('progressCircle');
    const statusText = document.getElementById('statusText');
    const speedNumber = document.getElementById('speedNumber');
    const resultsCard = document.getElementById('resultsCard');
    
    const pingVal = document.getElementById('pingVal');
    const downloadVal = document.getElementById('downloadVal');
    const uploadVal = document.getElementById('uploadVal');

    const CIRCUMFERENCE = 2 * Math.PI * 120; // 753.98

    function setProgress(percent) {
      const offset = CIRCUMFERENCE - (percent / 100 * CIRCUMFERENCE);
      progressCircle.style.strokeDashoffset = offset;
    }

    // --- Real Network Measurements ---

    async function measurePing() {
      const start = performance.now();
      await fetch('https://speed.cloudflare.com/__down?bytes=0', { cache: 'no-store' });
      return Math.round(performance.now() - start);
    }

    async function measureDownload(onProgress) {
      const response = await fetch('https://speed.cloudflare.com/__down?bytes=25000000', { cache: 'no-store' }); // 25MB Payload
      const reader = response.body.getReader();
      
      let receivedBytes = 0;
      const startTime = performance.now();
      const totalBytes = 25000000;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        receivedBytes += value.length;
        const duration = (performance.now() - startTime) / 1000;
        const currentMbps = ((receivedBytes * 8) / 1000000) / duration;
        const progressPercent = (receivedBytes / totalBytes) * 100;

        onProgress(currentMbps.toFixed(1), progressPercent);
      }

      const totalDuration = (performance.now() - startTime) / 1000;
      return (((receivedBytes * 8) / 1000000) / totalDuration).toFixed(1);
    }

    async function measureUpload() {
      const dummyData = new Uint8Array(5 * 1024 * 1024); // 5MB Payload
      const blob = new Blob([dummyData]);
      const startTime = performance.now();

      await fetch('https://speed.cloudflare.com/__up', {
        method: 'POST',
        body: blob,
        cache: 'no-store'
      });

      const duration = (performance.now() - startTime) / 1000;
      return (((blob.size * 8) / 1000000) / duration).toFixed(1);
    }

    // --- Interaction Controller ---

    gaugeWrapper.addEventListener('click', async () => {
      if (gaugeWrapper.classList.contains('testing')) return;

      // Lock UI state
      gaugeWrapper.classList.add('testing');
      resultsCard.classList.remove('active');
      setProgress(0);
      
      try {
        // Phase 1: Ping
        statusText.innerText = "TESTING PING";
        setProgress(15);
        const ping = await measurePing();
        pingVal.innerText = `${ping} ms`;

        // Phase 2: Download
        statusText.innerText = "TESTING DOWNLOAD";
        const downloadSpeed = await measureDownload((liveMbps, progressPercent) => {
          speedNumber.innerText = liveMbps;
          setProgress(15 + (progressPercent * 0.6)); // Scale progress visually
        });
        downloadVal.innerText = `${downloadSpeed} Mbps`;

        // Phase 3: Upload
        statusText.innerText = "TESTING UPLOAD";
        setProgress(85);
        const uploadSpeed = await measureUpload();
        uploadVal.innerText = `${uploadSpeed} Mbps`;
        setProgress(100);

        // Completion
        statusText.innerText = "TAP TO RESTART";
        speedNumber.innerText = downloadSpeed;
        resultsCard.classList.add('active');

      } catch (err) {
        statusText.innerText = "TEST FAILED";
        console.error(err);
      } finally {
        gaugeWrapper.classList.remove('testing');
      }
    });
  </script>
</body>
</html>
